<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>União Express Uberaba — Cotação de Frete</title></head>
<body style="margin:0;background:#f4f7fb"><iframe id="app" src="app.html" style="width:100%;height:100vh;border:0"></iframe>
<script>
const CIDADES_RJ=[
['Rio de Janeiro','RJ',20000001,23799999,'Rio de Janeiro'],
['Macaé','RJ',27900001,27979999,'Macaé'],['Nova Friburgo','RJ',28600001,28636999,'Nova Friburgo'],['Petrópolis','RJ',25600001,25779999,'Petrópolis'],['Duque de Caxias','RJ',25000001,25499999,'Duque de Caxias'],['Mesquita','RJ',26550001,26599999,'Mesquita'],['Nilópolis','RJ',26500001,26549999,'Nilópolis'],['Niterói','RJ',24000001,24399999,'Niterói'],['Nova Iguaçu','RJ',26000001,26099999,'Nova Iguaçu'],['São João do Meriti','RJ',25500001,25599999,'São João do Meriti'],['Resende','RJ',27500001,27549999,'Resende'],['Teresópolis','RJ',25950001,25995999,'Teresópolis'],['Volta Redonda','RJ',27200001,27299999,'Volta Redonda']
];
function normal(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim()}
function init(){const d=document.querySelector('iframe').contentDocument;if(!d)return;const selects=[...d.querySelectorAll('select')];const dest=selects.find(s=>normal(s.id).includes('DEST')||normal(s.name).includes('DEST'))||selects[0];const cep=d.querySelector('input[id*="cep" i],input[name*="cep" i]');if(!dest||!cep)return;
// Mantém todas as cidades já existentes e garante todas as cidades do RJ, incluindo a capital.
const existing=[...dest.options].map(o=>({text:o.textContent,value:o.value}));
CIDADES_RJ.forEach(c=>{if(!existing.some(o=>normal(o.text).includes(normal(c[0])))){const o=d.createElement('option');o.textContent=c[0]+' / '+c[1];o.value=c[0]+'|'+c[1];dest.appendChild(o)}});
function localizar(){const n=parseInt((cep.value||'').replace(/\D/g,''),10);if(!n)return;let cidade=CIDADES_RJ.find(c=>n>=c[2]&&n<=c[3]);if(cidade){const opt=[...dest.options].find(o=>normal(o.textContent).includes(normal(cidade[0])));if(opt){dest.value=opt.value;dest.dispatchEvent(new Event('change',{bubbles:true}));}let msg=d.getElementById('cepDestinoStatus');if(!msg){msg=d.createElement('div');msg.id='cepDestinoStatus';msg.style='margin-top:6px;font-size:12px;color:#0870d8;font-weight:700';cep.parentElement.appendChild(msg)}msg.textContent='Destino identificado: '+cidade[4]+' / RJ';}}
cep.addEventListener('input',localizar);cep.addEventListener('change',localizar);setTimeout(localizar,300)}
const fr=document.querySelector('iframe');fr.addEventListener('load',()=>{init();setTimeout(init,700);setTimeout(init,1800)});
</script></body></html>
