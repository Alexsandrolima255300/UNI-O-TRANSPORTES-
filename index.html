<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="União Express Uberaba — Cotação de Frete"><title>União Express Uberaba — Cotação de Frete</title><link rel="preload" as="image" href="logo-uniao-express.jpeg"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#007ECB}iframe{display:block;width:100%;height:100%;border:0}.loading-screen{position:fixed;inset:0;z-index:9999;background:#007ECB;display:flex;align-items:center;justify-content:center;opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease}.loading-screen.hide{opacity:0;visibility:hidden;pointer-events:none}.loading-content{display:flex;flex-direction:column;align-items:center;gap:24px}.loading-logo{width:210px;height:210px;object-fit:contain}.loading-spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="loading-screen" id="loadingScreen"><div class="loading-content"><img class="loading-logo" src="logo-uniao-express.jpeg" alt="União Express"><div class="loading-spinner"></div></div></div><iframe id="site" src="app.html" title="Sistema de cotação União Express"></iframe><script>const site=document.getElementById('site'),loadingScreen=document.getElementById('loadingScreen');let loaded=false;function hideLoading(){if(loaded)return;loaded=true;setTimeout(()=>loadingScreen.classList.add('hide'),500)}const RJ=[{c:'Macaé',p:'2 DIAS',a:27900001,b:27979999},{c:'Nova Friburgo',p:'2 DIAS',a:28600001,b:28636999},{c:'Petrópolis',p:'2 DIAS',a:25600001,b:25779999},{c:'Rio de Janeiro',p:'1 DIA',a:20000001,b:23799999},{c:'Duque de Caxias',p:'1 DIA',a:25000001,b:25499999},{c:'Mesquita',p:'1 DIA',a:26550001,b:26599999},{c:'Nilópolis',p:'1 DIA',a:26500001,b:26549999},{c:'Niterói',p:'1 DIA',a:24000001,b:24399999},{c:'Nova Iguaçu',p:'1 DIA',a:26000001,b:26099999},{c:'São João de Meriti',p:'1 DIA',a:25500001,b:25599999},{c:'Resende',p:'2 DIAS',a:27500001,b:27549999},{c:'Teresópolis',p:'2 DIAS',a:25950001,b:25995999},{c:'Volta Redonda',p:'2 DIAS',a:27200001,b:27299999}];const PATOS={c:'Patos de Minas',p:'A DEFINIR'};const clean=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();const num=v=>{let s=String(v??'').trim().replace(/R\$/g,'').replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');return Number(s)||0};function setup(){const f=site.contentDocument,w=site.contentWindow;if(!f||!f.body)return false;const logo=f.querySelector('.logo');if(logo){logo.removeAttribute('srcset');logo.src='logo-uniao-express.jpeg';logo.style.width='170px';logo.style.height='110px';logo.style.objectFit='contain';logo.style.filter='none'}const header=f.querySelector('header');if(header&&!f.getElementById('rastreioMercadoria')){const b=f.createElement('a');b.id='rastreioMercadoria';b.href='https://ssw.inf.br/2/rastreamento';b.target='_blank';b.rel='noopener noreferrer';b.textContent='Rastrear mercadoria';b.style.cssText='display:inline-flex;align-items:center;justify-content:center;margin-left:16px;padding:11px 16px;border-radius:12px;background:#fff;color:#007ECB;text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap';const brand=header.querySelector('.brand');if(brand)brand.parentNode.insertBefore(b,brand);else{const head=header.querySelector('.head');if(head)head.appendChild(b)}}const selects=[...f.querySelectorAll('select')];const dest=f.getElementById('dest')||selects.find(s=>clean(s.closest('.field')?.querySelector('label')?.textContent).includes('DESTINO'))||selects[selects.length-1];if(!dest)return false;dest.id='dest';let grj=[...dest.querySelectorAll('optgroup')].find(x=>clean(x.label)==='RIO DE JANEIRO');if(!grj){grj=f.createElement('optgroup');grj.label='RIO DE JANEIRO';dest.appendChild(grj)}grj.innerHTML='';RJ.forEach((x,i)=>{const o=f.createElement('option');o.value='RJ-'+i;o.textContent=x.c+' — '+x.p;grj.appendChild(o)});let gmg=[...dest.querySelectorAll('optgroup')].find(x=>clean(x.label)==='MINAS GERAIS');if(!gmg){gmg=f.createElement('optgroup');gmg.label='MINAS GERAIS';dest.appendChild(gmg)}if(!gmg.querySelector('option[value="PATOS-MINAS"]')){const o=f.createElement('option');o.value='PATOS-MINAS';o.textContent='Patos de Minas — MG';gmg.appendChild(o)}if(!w.__uniaoPatos){w.__uniaoPatos=true;const oldCalc=typeof w.calc==='function'?w.calc:null;w.calc=function(){const val=String(dest.value||'');if(val==='PATOS-MINAS'){const nf=num(f.getElementById('nf')?.value),kg=num(f.getElementById('kg')?.value);if(nf<=0)return alert('Informe o valor da nota fiscal.');if(kg<0)return alert('Informe um peso válido.');const fp=Math.max(0,(kg-50)*.70),fv=nf<=2200?40:nf*.018,cat=4,pd=Math.ceil(kg/100)*6,total=fp+fv+cat+pd,money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v),set=(id,v)=>{const e=f.getElementById(id);if(e)e.textContent=money(v)};set('total',total);set('fv',fv);set('fp',fp);set('dp',0);set('pd',pd);set('cat',cat);set('gris',0);const p=f.getElementById('prazo'),r=f.getElementById('route'),pol=f.getElementById('policy'),note=f.getElementById('note'),res=f.getElementById('res');if(p)p.textContent=PATOS.p;if(r)r.textContent='Uberaba/MG → Patos de Minas / MG';if(pol)pol.textContent=nf<=2200?'Frete valor R$ 40,00 • CAT R$ 4,00':'Frete valor 1,8% NF • CAT R$ 4,00';if(note)note.textContent='Regra Patos de Minas: até 50 kg não cobra frete peso; acima de 50 kg cobra somente o excedente a R$ 0,70/kg. Frete valor: até R$ 2.200,00 de NF, R$ 40,00; acima de R$ 2.200,00, 1,8% sobre a NF. CAT R$ 4,00 por CTe. Pedágio: R$ 6,00 por fração de 100 kg.';if(res)res.classList.add('show');return}if(oldCalc)return oldCalc();alert('Não foi possível localizar o cálculo original.')}}const style=f.createElement('style');style.textContent='header{background:#007ECB!important;box-shadow:0 10px 30px rgba(16,35,63,.16)!important}.logo{width:170px!important;height:110px!important;object-fit:contain!important}.primary{background:#007ECB!important}.ey,.big,.total{color:#007ECB!important}.ghost{color:#007ECB!important;background:#edf5fd!important}.result{background:#f3faff!important;border-color:#bfe6fb!important}.chip{border-color:#bfe6fb!important}input:focus,select:focus{border-color:#007ECB!important;box-shadow:0 0 0 4px rgba(0,126,203,.12)!important}#rastreioMercadoria:focus{outline:3px solid rgba(255,255,255,.45);outline-offset:2px}optgroup{font-weight:900}';f.head.appendChild(style);hideLoading();return true}site.addEventListener('load',()=>{let n=0,t=setInterval(()=>{if(setup()||++n>20)clearInterval(t)},200)});setTimeout(hideLoading,4000);</script></body></html>
