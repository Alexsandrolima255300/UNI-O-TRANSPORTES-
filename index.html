function regra(state,city){const c=clean(city);if(state==='MINAS GERAIS'){if(['ARAXA','MONTE CARMELO','PATOS DE MINAS','PATROCINIO','UBERLANDIA'].includes(c))return{min:40,pct:.018,kg:.70,ped:'normal'};if(['BELO HORIZONTE','CONTAGEM'].includes(c))return{min:75,pct:.02,kg:1,ped:'normal'};if(['JOAO PINHEIRO','PARACATU'].includes(c))return{min:50,pct:.02,kg:1,ped:'normal'};if(['SAO SEBASTIAO DO PARAISO','JUIZ DE FORA'].includes(c))return{min:100,pct:.025,kg:1.10,ped:'normal'};return{min:100,pct:.025,kg:1.10,ped:'normal'}}if(state==='PARANA')return{min:100,pct:.025,kg:1.10,ped:'pr'};if(['ESPIRITO SANTO','RIO DE JANEIRO','SAO PAULO','MATO GROSSO','MATO GROSSO DO SUL','RIO GRANDE DO SUL','SANTA CATARINA'].includes(clean(state)))return{min:130,pct:.03,kg:1.30,ped:'normal'};return null}
function setup(){const f=site.contentDocument,w=site.contentWindow;if(!f||!f.body)return false;const logo=f.querySelector('.logo');if(logo){logo.removeAttribute('srcset');logo.src='logo-uniao-express.jpeg';logo.style.width='170px';logo.style.height='110px';logo.style.objectFit='contain';logo.style.filter='none'}const header=f.querySelector('header');if(header&&!f.getElementById('rastreioMercadoria')){const b=f.createElement('a');b.id='rastreioMercadoria';b.href='https://ssw.inf.br/2/rastreamento';b.target='_blank';b.rel='noopener noreferrer';b.textContent='Rastrear mercadoria';b.style.cssText='display:inline-flex;align-items:center;justify-content:center;margin-left:16px;padding:11px 16px;border-radius:12px;background:#fff;color:#007ECB;text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap';const brand=header.querySelector('.brand');if(brand)brand.parentNode.insertBefore(b,brand);else header.querySelector('.head')?.appendChild(b)}const dest=f.getElementById('dest')||f.querySelector('select');if(!dest)return false;dest.id='dest';dest.innerHTML='<option value="">Selecione o destino</option>';const states={};CIDADES_PLANILHA.forEach(x=>{(states[x.state]??=[]).push(x)});Object.entries(states).forEach(([state,items])=>{const og=f.createElement('optgroup');og.label=state;items.forEach((x,i)=>{const o=f.createElement('option');o.value=state+'|'+x.city+'|'+i;o.textContent=x.city+' — '+x.prazo;o.dataset.state=state;o.dataset.city=x.city;o.dataset.prazo=x.prazo;o.dataset.start=x.start;o.dataset.end=x.end;og.appendChild(o)});dest.appendChild(og)});let fg=dest.closest('.fg')||f.querySelector('.fg');if(fg){let old=f.getElementById('cepDestino');if(old){const oldLabel=old.closest('.field')?.querySelector('label');if(oldLabel)oldLabel.textContent='CEP de destino'}else{const wrap=f.createElement('div');wrap.className='field';wrap.innerHTML='<label>CEP de destino</label><input id="cepDestino" inputmode="numeric" maxlength="9" placeholder="Digite o CEP de qualquer ci
