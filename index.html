5,coleta=d.c==='Rio de Janeiro'?15:0,total=fv+fp+dp+pd+cat+gris+coleta;f.getElementById('total').textContent=w.money(total);f.getElementById('prazo').textContent=d.p;f.getElementById('route').textContent='Uberaba/MG → '+d.c+' / RJ';f.getElementById('policy').textContent='Mín. R$ 130,00 • 3,0% NF';[['fv',fv],['fp',fp],['dp',dp],['pd',pd],['cat',cat],['gris',gris]].forEach(([id,v])=>f.getElementById(id).textContent=w.money(v));const note='Regra RJ: mínimo R$ 130,00 ou 3,0% da NF; acima de 50 kg, R$ 1,30/kg excedente; GRIS 0,15%; despacho R$ 2,00; CAT R$ 4,00; pedágio R$ 6,00 por fração de 100 kg.'+(coleta?' Taxa de coleta de R$ 15,00 aplicada para Rio de Janeiro/RJ.':'');f.getElementById('note').textContent=note;f.getElementById('res').classList.add('show')};const body=f.getElementById('body');if(body&&!body.dataset.rjAdded){body.dataset.rjAdded='1';RJ.forEach(x=>{const tr=f.createElement('tr');tr.dataset.rj='1';tr.innerHTML='<td><b>'+x.c+'</b></td><td>RJ · RIO DE JANEIRO</td><td>'+x.p+'</td><td>R$ 130,00</td><td>3,0%</td>';body.appendChild(tr)});const search=f.getElementById('search');if(search){const oldRender=w.render;w.render=function(q){oldRender(q);const z=clean(q);RJ.filter(x=>!z||clean(x.c).includes(z)||'RIO DE JANEIRO'.includes(z)||'RJ'.includes(z)).forEach(x=>{const tr=f.createElement('tr');tr.dataset.rj='1';tr.innerHTML='<td><b>'+x.c+'</b></td><td>RJ · RIO DE JANEIRO</td><td>'+x.p+'</td><td>R$ 130,00</td><td>3,0%</td>';body.appendChild(tr)})}}}}site.addEventListener('load',function(){setTimeout(setup,100)});if(site.contentDocument&&site.contentDocument.readyState==='complete')setTimeout(setup,100)})();</script></body></html>
