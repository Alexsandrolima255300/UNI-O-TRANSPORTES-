<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>União Express Uberaba — Cotação de Frete</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#007ECB}iframe{display:block;width:100%;height:100%;border:0}.loading-screen{position:fixed;inset:0;z-index:9999;background:#007ECB;display:flex;align-items:center;justify-content:center}.loading-content{display:flex;flex-direction:column;align-items:center;gap:24px}.loading-logo{width:210px;height:210px;object-fit:contain}.loading-spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head>
<body><div class="loading-screen" id="loadingScreen"><div class="loading-content"><img class="loading-logo" src="logo-uniao-express.jpeg" alt="União Express"><div class="loading-spinner"></div></div></div><iframe id="app" src="app.html" title="Sistema de cotação União Express"></iframe>
<script>
const RJ=[
['Rio de Janeiro','RJ',20000001,23799999,'Rio de Janeiro'],['Macaé','RJ',27900001,27979999,'Macaé'],['Nova Friburgo','RJ',28600001,28636999,'Nova Friburgo'],['Petrópolis','RJ',25600001,25779999,'Petrópolis'],['Duque de Caxias','RJ',25000001,25499999,'Duque de Caxias'],['Mesquita','RJ',26550001,26599999,'Mesquita'],['Nilópolis','RJ',26500001,26549999,'Nilópolis'],['Niterói','RJ',24000001,24399999,'Niterói'],['Nova Iguaçu','RJ',26000001,26099999,'Nova Iguaçu'],['São João do Meriti','RJ',25500001,25599999,'São João do Meriti'],['Resende','RJ',27500001,27549999,'Resende'],['Teresópolis','RJ',25950001,25995999,'Teresópolis'],['Volta Redonda','RJ',27200001,27299999,'Volta Redonda']
];
const normal=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
function setup(){const d=document.getElementById('app').contentDocument;if(!d||!d.body)return false;const selects=[...d.querySelectorAll('select')];const dest=selects.find(s=>normal(s.id).includes('DEST')||normal(s.name).includes('DEST'))||selects[0];if(!dest)return false;dest.id='dest';
RJ.forEach(c=>{if(![...dest.options].some(o=>normal(o.textContent).includes(normal(c[0])))){const o=d.createElement('option');o.textContent=c[0]+' / '+c[1];o.value=c[0]+'|'+c[1];o.dataset.city=c[0];o.dataset.state='RJ';dest.appendChild(o)}});
let box=d.getElementById('cepAtendimento');if(!box){const field=d.createElement('div');field.className='field';field.id='cepAtendimento';field.style.cssText='margin-top:13px;grid-column:1/-1';field.innerHTML='<label>CEP de destino</label><input id="cepConsulta" inputmode="numeric" maxlength="9" placeholder="Digite o CEP para verificar atendimento"><small id="cepResultado" style="display:block;margin-top:7px;font-size:12px;font-weight:800"></small>';const fg=dest.closest('.fg');(fg||dest.parentElement).appendChild(field)}
const cep=d.getElementById('cepConsulta'),out=d.getElementById('cepResultado');if(cep&&!cep.dataset.bound){cep.dataset.bound='1';cep.addEventListener('input',async()=>{let v=cep.value.replace(/\D/g,'').slice(0,8);cep.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v;if(v.length<8){out.textContent='';return}const n=Number(v);const local=RJ.find(c=>n>=c[2]&&n<=c[3]);if(local){const opt=[...dest.options].find(o=>normal(o.textContent).includes(normal(local[0])));if(opt){dest.value=opt.value;dest.dispatchEvent(new Event('change',{bubbles:true}))}out.textContent='✓ ATENDE — '+local[4]+' / RJ';out.style.color='#168447';return}try{out.textContent='Consultando CEP…';const r=await fetch('https://viacep.com.br/ws/'+v+'/json/');const data=await r.json();if(data.erro){out.textContent='✕ CEP não encontrado.';out.style.color='#c62828';return}const city=data.localidade||'';const uf=data.uf||'';const opt=[...dest.options].find(o=>normal(o.textContent).includes(normal(city)));if(opt){dest.value=opt.value;dest.dispatchEvent(new Event('change',{bubbles:true}));out.textContent='✓ ATENDE — '+city+' / '+uf;out.style.color='#168447'}else{out.textContent='✕ NÃO ATENDE — '+city+' / '+uf+' não está na área cadastrada.';out.style.color='#c62828'}}catch(e){out.textContent='Não foi possível consultar o CEP agora. Tente novamente.';out.style.color='#c62828'}})}
const style=d.createElement('style');style.textContent='header{background:#007ECB!important}.primary{background:#007ECB!important}.cep-atendimento{}#cepConsulta:focus{border-color:#007ECB!important;box-shadow:0 0 0 4px rgba(0,126,203,.12)!important}';d.head.appendChild(style);document.getElementById('loadingScreen').style.display='none';return true}
const fr=document.getElementById('app');fr.addEventListener('load',()=>{let n=0,t=setInterval(()=>{if(setup()||++n>30)clearInterval(t)},200)});
</script></body></html>
