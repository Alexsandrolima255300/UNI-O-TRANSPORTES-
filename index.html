const RJCEP={'MACAÉ':[27900001,27979999],'NOVA FRIBURGO':[28600001,28636999],'PETROPOLIS':[25600001,25779999],'RIO DE JANEIRO':[20000001,23799999],'DUQUE DE CAXIAS':[25000001,25499999],'MESQUITA':[26550001,26599999],'NILOPOLIS':[26500001,26549999],'NITEROI':[24000001,24399999],'NOVA IGUACU':[26000001,26099999],'SAO JOAO DO MERITI':[25500001,25599999],'RESENDE':[27500001,27549999],'TERESOPOLIS':[25950001,25995999],'VOLTA REDONDA':[27200001,27299999]};
const clean=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\*/g,'').replace(/\s+/g,' ').trim();const num=v=>{let s=String(v??'').trim().replace(/R\$/g,'').replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');return Number(s)||0};
function ruleFor(state,city){const c=clean(city);if(state==='MINAS GERAIS'){if(['ARAXA','MONTE CARMELO','PATOS DE MINAS','PATROCINIO','UBERLANDIA'].includes(c))return{min:40,pct:.018,kg:.7,limit:2222.22222222222,ped:'roundup'};if(['BELO HORIZONTE','CONTAGEM'].includes(c))return{min:75,pct:.02,kg:1,limit:3750,ped:'roundup'};if(['JOAO PINHEIRO','PARACATU'].includes(c))return{min:50,pct:.02,kg:1,limit:2500,ped:'roundup'};return{min:100,pct:.025,kg:1.1,limit:4000,ped:'roundup'}}if(state==='PARANÁ')return{min:100,pct:.025,kg:1.1,limit:4000,ped:'pr'};if(state==='ESPÍRITO SANTO'||state==='RIO DE JANEIRO'||state==='SÃO PAULO'||state==='SANTA CATARINA'||state==='MATO GROSSO'||state==='MATO GROSSO DO SUL'||state==='RIO GRANDE DO SUL')return{min:130,pct:.03,kg:1.3,limit:4333.33333333333,ped:'roundup'};return null}
function setup(){const f=site.contentDocument,w=site.contentWindow;if(!f||!f.body)return false;const logo=f.querySelector('.logo');if(logo){logo.removeAttribute('srcset');logo.src='logo-uniao-express.jpeg';logo.style.width='170px';logo.style.height='110px';logo.style.objectFit='contain';logo.style.filter='none'}const header=f.querySelector('header');if(header&&!f.getElementById('rastreioMercadoria')){const b=f.createElement('a');b.id='rastreioMercadoria';b.href='https://ssw.inf.br/2/rastreamento';b.target='_blank';b.rel='noopener noreferrer';b.textContent='Rastrear mercadoria';b.style.cssText='display:inline-flex;align-items:center;justify-content:center;margin-left:16px;padding:11px 16px;border-radius:12px;background:#fff;color:#007ECB;text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap';const brand=header.querySelector('.brand');if(brand)brand.parentNode.insertBefore(b,brand);else header.querySelector('.head')?.appendChild(b)}
const dest=f.getElementById('dest')||f.querySelector('select');if(!dest)return false;dest.id='dest';dest.innerHTML='<option value="">Selecione o destino</option>';Object.entries(GROUPS).forEach(([state,text])=>{const og=f.createElement('optgroup');og.label=state;text.split('|').forEach(item=>{const [city,prazo]=item.split('~');const o=f.createElement('option');o.value=state+'|'+city;o.textContent=city+' — '+prazo;o.dataset.state=state;o.dataset.city=city;o.dataset.prazo=prazo;og.appendChild(o)});dest.appendChild(og)});
const fg=dest.closest('.fg')||f.querySelector('.fg');if(fg&&!f.getElementById('cepDestino')){const wrap=f.createElement('div');wrap.className='field';wrap.innerHTML='<label>CEP de destino (RJ)</label><input id="cepDestino" inputmode="numeric" maxlength="9" placeholder="Ex.: 27910-000"><small id="cepStatus" style="font-size:11px;color:#64758b"></small>';fg.appendChild(wrap);const cep=f.getElementById('cepDestino');cep.addEventListener('input',()=>{let v=cep.value.replace(/\D/g,'').slice(0,8);cep.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v;const n=Number(v),hit=Object.entries(RJCEP).find(([k,r])=>n>=r[0]&&n<=r[1]),st=f.getElementById('cepStatus');if(hit){const opt=[...dest.options].find(o=>clean(o.dataset.city)===hit[0]&&o.dataset.state==='RIO DE JANEIRO');if(opt)dest.value=opt.value;st.textContent='Destino identificado: '+(opt?.dataset.city||hit[0])+' / RJ';st.style.color='#007ECB'}else st.textContent=v.length===8?'CEP fora das faixas RJ da planilha.':''})}
if(w.__uniaoPlanilha)return true;w.__uniaoPlanilha=true;const oldCalc=typeof w.calc==='function'?w.calc:null;w.calc=function(){const o=dest.options[dest.selectedIndex],state=o?.dataset.state,city=o?.dataset.city,rule=ruleFor(state,city),nf=num(f.getElementById('nf')?.value),kg=num(f.getElementById('kg')?.value);if(!rule){if(oldCalc)return oldCalc();return alert('Destino sem regra automática cadastrada na planilha.')}if(nf<=0)return alert('Informe o valor da nota fiscal.');if(kg<0)return alert('Informe um peso válido.');const fv=Math.max(nf*rule.pct,rule.min),fp=Math.max(0,kg-50)*rule.kg,dp=nf>0?2:0,pd=rule.ped==='pr'?(kg<100.1?6:12):Math.ceil(kg/100)*6,cat=nf>0?4:0,gris=nf*.0015,total=fv+fp+dp+cat+gris,money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v),set=(id,v)=>{const e=f.getElementById(id);if(e)e.textContent=money(v)};set('total',total);set('fv',fv);set('fp',fp);set('dp',dp);set('pd',pd);set('cat',cat);set('gris',gris);const p=f.getElementById('prazo'),r=f.getElementById('route'),pol=f.getElementById('policy'),note=f.getElementById('note'),res=f.getElementById('res');if(p)p.textContent=o.dataset.prazo;if(r)r.textContent='Uberaba/MG → '+city;if(pol)pol.textContent='Mín. R$ '+rule.min.toFixed(2).replace('.',',')+' • '+(rule.pct*100).toFixed(1).replace('.',',')+'% da NF';if(note)note.textContent='Cálculo conforme a planilha: Frete Valor = maior entre percentual da NF e frete mínimo; Frete Peso = valor por kg excedente de 50 kg; Despacho R$ 2,00; Pedágio conforme a fórmula da região; CAT R$ 4,00; GRIS 0,15% da NF. Total = soma dos componentes.';if(res)res.classList.add('show')};
const style=f.createElement('style');style.textContent='header{background:#007ECB!important}.logo{width:170px!important;height:110px!important;object-fit:contain!important}.primary{background:#007ECB!important}.ey,.big,.total{color:#007ECB!important}.ghost{color:#007ECB!important;background:#edf5fd!important}.result{background:#f3faff!important;border-color:#bfe6fb!important}.chip{border-color:#bfe6fb!important}input:focus,select:focus{border-color:#007ECB!important;box-shadow:0 0 0 4px rgba(0,126,203,.12)!important}';f.head.appendChild(style);hideLoading();return true}site.addEventListener('load',()=>{let n=0,t=setInterval(()=>{if(setup()||++n>20)clearInterval(t)},200)});setTimeout(hideLoading,4000);</script></body></html>
