<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="União Express Uberaba — Cotação de Frete"><title>União Express Uberaba — Cotação de Frete</title><link rel="preload" as="image" href="logo-uniao-express.jpeg"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#007ECB}iframe{display:block;width:100%;height:100%;border:0}.loading-screen{position:fixed;inset:0;z-index:9999;background:#007ECB;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease,visibility .45s ease}.loading-screen.hide{opacity:0;visibility:hidden;pointer-events:none}.loading-content{display:flex;flex-direction:column;align-items:center;gap:24px}.loading-logo{width:210px;height:210px;object-fit:contain}.loading-spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="loading-screen" id="loadingScreen"><div class="loading-content"><img class="loading-logo" src="logo-uniao-express.jpeg" alt="União Express"><div class="loading-spinner"></div></div></div><iframe id="site" src="app.html" title="Sistema de cotação União Express"></iframe><script>const site=document.getElementById('site'),loadingScreen=document.getElementById('loadingScreen');let loaded=false;function hideLoading(){if(loaded)return;loaded=true;setTimeout(()=>loadingScreen.classList.add('hide'),500)}
const RJ=[['Macaé','2 DIAS',27900001,27979999],['Nova Friburgo','2 DIAS',28600001,28636999],['Petrópolis','2 DIAS',25600001,25779999],['Rio de Janeiro','1 DIA',20000001,23799999],['Duque de Caxias','1 DIA',25000001,25499999],['Mesquita','1 DIA',26550001,26599999],['Nilópolis','1 DIA',26500001,26549999],['Niterói','1 DIA',24000001,24399999],['Nova Iguaçu','1 DIA',26000001,26099999],['São João de Meriti','1 DIA',25500001,25599999],['Resende','2 DIAS',27500001,27549999],['Teresópolis','2 DIAS',25950001,25995999],['Volta Redonda','2 DIAS',27200001,27299999]];
const RULES={g1:{cities:['Araxá','Monte Carmelo','Patos de Minas','Patrocínio','Uberlândia'],min:40,pct:.018,kg:.7,limit:2222.22222222222},g2:{cities:['Belo Horizonte','Contagem'],min:75,pct:.02,kg:1,limit:3750},g3:{cities:['João Pinheiro','Paracatu'],min:50,pct:.02,kg:1,limit:2500},g4:{cities:['Juiz de Fora','São Sebastião do Paraíso'],min:100,pct:.025,kg:1.1,limit:4000},g5:{cities:['Rio de Janeiro','São Paulo','Espírito Santo','Mato Grosso','Mato Grosso do Sul','Rio Grande do Sul','Santa Catarina'],min:130,pct:.03,kg:1.3,limit:4333.33333333333}};
const clean=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\*/g,'').replace(/\s+/g,' ').trim();const num=v=>{let s=String(v??'').trim().replace(/R\$/g,'').replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');return Number(s)||0};function ruleFor(n){n=clean(n);for(const k in RULES)if(RULES[k].cities.some(c=>clean(c)===n))return RULES[k];return null}
function setup(){const f=site.contentDocument,w=site.contentWindow;if(!f||!f.body)return false;const logo=f.querySelector('.logo');if(logo){logo.removeAttribute('srcset');logo.src='logo-uniao-express.jpeg';logo.style.width='170px';logo.style.height='110px';logo.style.objectFit='contain';logo.style.filter='none'}const header=f.querySelector('header');if(header&&!f.getElementById('rastreioMercadoria')){const b=f.createElement('a');b.id='rastreioMercadoria';b.href='https://ssw.inf.br/2/rastreamento';b.target='_blank';b.rel='noopener noreferrer';b.textContent='Rastrear mercadoria';b.style.cssText='display:inline-flex;align-items:center;justify-content:center;margin-left:16px;padding:11px 16px;border-radius:12px;background:#fff;color:#007ECB;text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap';const brand=header.querySelector('.brand');if(brand)brand.parentNode.insertBefore(b,brand);else header.querySelector('.head')?.appendChild(b)}
const dest=f.getElementById('dest')||f.querySelector('select');if(!dest)return false;dest.id='dest';let g=[...dest.querySelectorAll('optgroup')].find(x=>clean(x.label)==='RIO DE JANEIRO');if(!g){g=f.createElement('optgroup');g.label='RIO DE JANEIRO';dest.appendChild(g)}g.innerHTML='';RJ.forEach((x,i)=>{const o=f.createElement('option');o.value='RJ-'+i;o.textContent=x[0]+' — '+x[1];g.appendChild(o)});
const fg=dest.closest('.fg')||f.querySelector('.fg');if(fg&&!f.getElementById('cepDestino')){const wrap=f.createElement('div');wrap.className='field';wrap.innerHTML='<label>CEP de destino</label><input id="cepDestino" inputmode="numeric" maxlength="9" placeholder="Ex.: 27910-000"><small id="cepStatus" style="font-size:11px;color:#64758b"></small>';fg.appendChild(wrap);const cep=f.getElementById('cepDestino');cep.addEventListener('input',()=>{let v=cep.value.replace(/\D/g,'').slice(0,8);cep.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v;const n=Number(v),ix=RJ.findIndex(x=>n>=x[2]&&n<=x[3]),st=f.getElementById('cepStatus');if(ix>=0){dest.value='RJ-'+ix;st.textContent='Destino identificado: '+RJ[ix][0]+' / RJ';st.style.color='#007ECB'}else st.textContent=v.length===8?'CEP fora das faixas RJ cadastradas.':''})}
if(w.__uniaoPlanilha)return true;w.__uniaoPlanilha=true;const oldCalc=typeof w.calc==='function'?w.calc:null;w.calc=function(){const isRJ=String(dest.value).startsWith('RJ-');const selected=dest.options[dest.selectedIndex]?.textContent||'';const name=isRJ?RJ[Number(dest.value.slice(3))]?.[0]:selected.replace(/\s+—.*$/,'').trim();const rule=isRJ?RULES.g5:ruleFor(name);if(!rule){if(oldCalc)return oldCalc();return alert('Destino sem regra automática cadastrada na planilha.')}const nf=num(f.getElementById('nf')?.value),kg=num(f.getElementById('kg')?.value);if(nf<=0)return alert('Informe o valor da nota fiscal.');if(kg<0)return alert('Informe um peso válido.');
/* Fórmulas da aba "Calculo Automático": Frete Valor = maior entre NF×percentual e mínimo; Frete Peso = kg excedente de 50×tarifa; Despacho = R$2 quando NF>0; Pedágio = fórmula por região; CAT = R$4 quando NF>0; GRIS = 0,15% da NF; total = soma. */const fv=Math.max(nf*rule.pct,rule.min),fp=Math.max(kg-50,0)*rule.kg,dp=nf>0?2:0,pd=rule===RULES.g5||rule===RULES.g1||rule===RULES.g2||rule===RULES.g3||rule===RULES.g4?Math.ceil(kg/100)*6:0,cat=nf>0?4:0,gris=nf*.0015,total=fv+fp+dp+pd+cat+gris;const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v),set=(id,v)=>{const e=f.getElementById(id);if(e)e.textContent=money(v)};set('total',total);set('fv',fv);set('fp',fp);set('dp',dp);set('pd',pd);set('cat',cat);set('gris',gris);const p=f.getElementById('prazo'),r=f.getElementById('route'),pol=f.getElementById('policy'),note=f.getElementById('note'),res=f.getElementById('res');if(p)p.textContent=isRJ?RJ[Number(dest.value.slice(3))][1]:'';if(r)r.textContent='Uberaba/MG → '+name;if(pol)pol.textContent='Mín. R$ '+rule.min.toFixed(2).replace('.',',')+' • '+(rule.pct*100).toFixed(1).replace('.',',')+'% da NF';if(note)note.textContent='Planilha: mínimo R$ '+rule.min.toFixed(2).replace('.',',')+'; acima do ponto de equilíbrio, '+(rule.pct*100).toFixed(1).replace('.',',')+'% da NF. Acima de 50 kg: R$ '+rule.kg.toFixed(2).replace('.',',')+' por kg excedente. Despacho R$ 2,00; pedágio R$ 6,00 por fração de 100 kg; CAT R$ 4,00; GRIS 0,15% da NF.';if(res)res.classList.add('show')};
const style=f.createElement('style');style.textContent='header{background:#007ECB!important}.logo{width:170px!important;height:110px!important;object-fit:contain!important}.primary{background:#007ECB!important}.ey,.big,.total{color:#007ECB!important}.ghost{color:#007ECB!important;background:#edf5fd!important}.result{background:#f3faff!important;border-color:#bfe6fb!important}.chip{border-color:#bfe6fb!important}input:focus,select:focus{border-color:#007ECB!important;box-shadow:0 0 0 4px rgba(0,126,203,.12)!important}';f.head.appendChild(style);hideLoading();return true}site.addEventListener('load',()=>{let n=0,t=setInterval(()=>{if(setup()||++n>20)clearInterval(t)},200)});setTimeout(hideLoading,4000);</script></body></html>
