name: Ajustar cor do cabeçalho
on:
  push:
    branches: [main]
jobs:
  ajustar:
    if: github.event.head_commit.message != 'style: match header color to logo [skip ci]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar somente a cor do cabeçalho
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          old = 'header{background:linear-gradient(135deg,#064ea8,#0868cc)!important;'
          new = 'header{background:#0057a8!important;'
          if old not in s:
              raise SystemExit('Cor atual do cabeçalho não encontrada; nenhuma alteração feita.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'style: match header color to logo [skip ci]'
          git push
