name: Remover paineis da cotacao

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remover-paineis:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Remover os dois paineis visuais
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.html')
          text = path.read_text(encoding='utf-8')
          marker = '.heroCard{display:none!important}.grid>.card:nth-child(2){display:none!important}.grid{grid-template-columns:1fr!important}'
          if marker not in text:
              text = text.replace('</style>', marker + '</style>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Salvar alteracao no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "Nada para alterar."
            exit 0
          fi
          git commit -m "Remove paineis de base e regras da tela principal"
          git push
