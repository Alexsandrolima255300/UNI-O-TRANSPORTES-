name: Estilizar cabecalho

on:
  push:
    paths:
      - '.github/workflows/estilizar-cabecalho.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar novo cabecalho
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          css = r'''<style>
          /* Cabeçalho inspirado no layout Rodonaves, usando a identidade da União Express */
          header{background:#fff!important;padding:0 18px!important;box-shadow:0 2px 12px rgba(16,35,63,.10)!important;border-bottom:1px solid #e7edf4!important;position:sticky!important;top:0!important;z-index:1000!important}
          header .head{max-width:1400px!important;min-height:66px!important;margin:0 auto!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:24px!important}
          header .logo{width:235px!important;height:58px!important;object-fit:contain!important;border-radius:0!important;display:block!important}
          header .brand{display:none!important}
          .ue-nav{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:34px!important;margin-left:auto!important;white-space:nowrap!important}
          .ue-nav-item{color:#0758b7!important;font-size:13px!important;font-weight:900!important;letter-spacing:.045em!important;text-decoration:none!important;cursor:pointer!important;transition:color .18s ease,transform .18s ease!important}
          .ue-nav-item:hover{color:#007ECB!important;transform:translateY(-1px)!important}
          .ue-nav-item.active{color:#007ECB!important}
          .ue-nav-separator{width:1px;height:24px;background:#e3e9f0;display:block}
          .ue-account{display:flex!important;align-items:center!important;gap:7px!important;color:#0758b7!important;font-size:12px!important;font-weight:900!important;letter-spacing:.03em!important}
          .ue-chevron{font-size:10px!important;line-height:1!important}
          @media(max-width:1050px){.ue-nav{gap:20px}.ue-nav-item{font-size:11px}header .logo{width:205px!important}}
          @media(max-width:800px){header{padding:0 12px!important}header .head{min-height:62px!important;gap:12px!important}.ue-nav{gap:14px;overflow-x:auto;max-width:calc(100vw - 180px);padding:4px 0;scrollbar-width:none}.ue-nav::-webkit-scrollbar{display:none}.ue-nav-item{font-size:10px}.ue-nav-separator,.ue-account{display:none!important}header .logo{width:175px!important;height:54px!important}}
          </style>'''
          if 'class="ue-nav"' not in s:
              s = s.replace('</style></head>', css + '</style></head>', 1)
          nav_script = r'''<script>
          (function(){
            const head=document.querySelector('header .head');
            if(!head || head.querySelector('.ue-nav')) return;
            const nav=document.createElement('nav');
            nav.className='ue-nav';
            nav.setAttribute('aria-label','Navegação principal');
            nav.innerHTML='<span class="ue-nav-item" data-action="track">RASTREAMENTO</span><span class="ue-nav-item">PREVISÃO DE ENTREGA</span><span class="ue-nav-item">COLETA</span><span class="ue-nav-item active" data-action="quote">COTAÇÃO</span><span class="ue-nav-item">FALE CONOSCO</span><span class="ue-nav-separator"></span><span class="ue-account">UNIÃO EXPRESS <span class="ue-chevron">▾</span></span>';
            head.appendChild(nav);
            const track=nav.querySelector('[data-action="track"]');
            if(track) track.addEventListener('click',()=>window.open('https://ssw.inf.br/2/rastreamento','_blank','noopener,noreferrer'));
            const quote=nav.querySelector('[data-action="quote"]');
            if(quote) quote.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
          })();
          </script>'''
          if 'class="ue-nav"' not in s:
              s = s.replace('</body>', nav_script + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alteracoes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || git commit -m 'Deixa cabecalho com visual inspirado na Rodonaves'
          git push
