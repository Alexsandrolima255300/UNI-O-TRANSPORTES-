name: Corrigir clique do botão Coleta
on:
  push:
    paths:
      - 'scripts/fix-coleta-click.py'
      - '.github/workflows/fix-coleta-click-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix-coleta-click.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Corrigir definitivamente botão Coleta'
          git push
