name: Aplicar prazo previsão V6
on:
  push:
    paths:
      - 'scripts/fix-prazo-previsao-v6.py'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar V6
        run: python scripts/fix-prazo-previsao-v6.py
      - name: Commitar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Corrigir prazo na página de previsão de entrega'
          git push
