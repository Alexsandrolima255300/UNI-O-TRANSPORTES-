name: Reparar site União Express
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reparar-site-uniao.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar reparos
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.html')
          s = app.read_text(encoding='utf-8')

          old = "if(['CONTAGEM','BELO HORIZONTE','JOAO PINHEIRO','PARACATU'].includes(c))return[75,.02,1,'standard'];"
          new = "if(['CONTAGEM','BELO HORIZONTE'].includes(c))return[75,.02,1,'standard'];if(['JOAO PINHEIRO','PARACATU'].includes(c))return[50,.02,1,'standard'];"
          s = s.replace(old, new)
          s = s.replace('["Nilopolis","1 DIA","Atendimento especial"],["Nilopolis","1 DIA","Atendimento especial"],','["Nilopolis","1 DIA","Atendimento especial"],')
          replacements = {
              '"SIONOP"': '"SINOP"',
              '"RIBERIÃO DO PINHAL"': '"RIBEIRÃO DO PINHAL"',
              '"Almirante Tamadaré"': '"Almirante Tamandaré"',
              '"Alraucária"': '"Araucária"',
              '"Campinas Grande do Sul"': '"Campina Grande do Sul"',
              '"Pinhas"': '"Pinhais"',
              '"Piraraquara"': '"Piraquara"',
              '"Vargrem Grande Paulista"': '"Vargem Grande Paulista"',
              '"SANTA BARBA DO OESTE"': '"SANTA BÁRBARA D\'OESTE"',
              '"São Joao do Meriti"': '"São João do Meriti"',
              '"CARIACIA"': '"CARIACICA"',
              '"ITAPETINIGA"': '"ITAPETININGA"'
          }
          for a, b in replacements.items():
              s = s.replace(a, b)

          if 'id="ueCalcBtn"' not in s:
              needle = '<a class="ue-nav-item" href="#rastreamento" id="ueTrackBtn" role="button">RASTREAR CARGA</a>'
              s = s.replace(needle, needle + '<a class="ue-nav-item" href="#calculo" id="ueCalcBtn" role="button">COMO CALCULAMOS</a>', 1)

          if 'OPEN_CALC_MODAL_REPAIR' not in s:
              extra = """<script>
          /* OPEN_CALC_MODAL_REPAIR */
          (function(){
            document.addEventListener('click',function(e){
              var el=e.target.closest&&e.target.closest('#ueCalcBtn');
              if(!el)return;
              e.preventDefault();
              try{if(window.parent&&typeof window.parent.openCalcModal==='function'){window.parent.openCalcModal();return;}}catch(err){}
            },true);
          })();
          </script>"""
              s = s.replace('</body>', extra + '\n</body>', 1)

          app.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')

          start = s.find('<script>\n/* DELIVERY_PREDICTION_V6 */')
          if start >= 0:
              end = s.find('</script>', start)
              if end >= 0:
                  end += len('</script>')
                  v7 = """<script>
          /* DELIVERY_PREDICTION_V7 */
          (function(){
            const norm=v=>(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^A-Z0-9]+/gi,' ').trim().toUpperCase();
            const $=id=>document.getElementById(id);
            function show(ok,title,text,prazo){const box=$('deliveryResult'),t=$('deliveryResultTitle'),tx=$('deliveryResultText'),d=$('deliveryDays');if(!box)return;box.style.setProperty('display','block','important');box.className='delivery-result show '+(ok?'ok':'no');t.textContent=title;tx.textContent=text;d.textContent=prazo||'';d.style.setProperty('display',prazo?'block':'none','important')}
            function find(city,uf){
              const frame=$('app'),doc=frame&&frame.contentDocument;if(!doc)return null;
              const wanted=norm(city),state=norm(uf);
              const map={MG:'MINAS GERAIS',SP:'SAO PAULO',RJ:'RIO DE JANEIRO',ES:'ESPIRITO SANTO',SC:'SANTA CATARINA',MT:'MATO GROSSO',MS:'MATO GROSSO DO SUL',PR:'PARANA',RS:'RIO GRANDE DO SUL'};
              const options=[...doc.querySelectorAll('select option')];
              for(const o of options){
                const base=norm((o.textContent||'').split('—')[0].split('•')[0]);
                if(base!==wanted)continue;
                if(!state)return o;
                const group=norm(o.parentElement&&o.parentElement.label||'');
                if(group===norm(map[state]||state))return o;
              }
              return options.find(o=>norm((o.textContent||'').split('—')[0].split('•')[0])===wanted)||null;
            }
            async function viaCep(cep){const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/');if(!r.ok)throw Error();const j=await r.json();if(j.erro)throw Error();return j}
            async function consultar(){
              const cepEl=$('deliveryCep'),cityEl=$('deliveryCity');let cep=(cepEl?.value||'').replace(/\\D/g,''),city=(cityEl?.value||'').trim(),uf='';
              try{
                if(cep){if(cep.length!==8){show(false,'CEP inválido','Digite um CEP com 8 números.','');return}const j=await viaCep(cep);city=j.localidade||city;uf=j.uf||'';if(cityEl)cityEl.value=city}
                if(!city){show(false,'Informe um destino','Digite o CEP ou a cidade que deseja consultar.','');return}
                const opt=find(city,uf);
                if(!opt){show(false,'✕ A União Express não atende esta cidade',city+(uf?' - '+uf:'')+' não foi encontrada na base de destinos atendidos.','');return}
                const prazo=(opt.textContent.match(/—\\s*(\\d+\\s*DIAS?)/i)||[])[1]||'';
                show(true,'✓ A União Express atende esta cidade','Destino confirmado: '+city+(uf?' - '+uf:'')+'. Prazo conforme a tabela cadastrada para a rota.',prazo?'Prazo estimado: '+prazo.toLowerCase():'Prazo conforme tabela');
                const select=opt.parentElement;if(select){select.value=opt.value;select.dispatchEvent(new Event('change',{bubbles:true}))}
              }catch(e){show(false,'Não foi possível consultar','Confira o CEP ou informe a cidade manualmente.','')}
            }
            function bind(){const b=$('deliveryConsult');if(!b)return;b.onclick=consultar;const c=$('deliveryCep');if(c&&!c.dataset.v7){c.dataset.v7='1';c.addEventListener('input',()=>{let v=c.value.replace(/\\D/g,'').slice(0,8);c.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v})}}
            bind();setTimeout(bind,300);setTimeout(bind,1000);setTimeout(bind,2000);
          })();
          </script>"""
                  s = s[:start] + v7 + s[end:]

          if 'window.openCalcModal' not in s:
              needle = "const modal=document.getElementById('calcModal');"
              repl = "window.openCalcModal=()=>{const m=document.getElementById('calcModal');m.classList.add('show');m.setAttribute('aria-hidden','false')};window.closeCalcModal=()=>{const m=document.getElementById('calcModal');m.classList.remove('show');m.setAttribute('aria-hidden','true')};const modal=document.getElementById('calcModal');"
              s = s.replace(needle, repl, 1)
          idx.write_text(s, encoding='utf-8')
          PY
      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('app.html').read_text(encoding='utf-8')
          i=Path('index.html').read_text(encoding='utf-8')
          assert "['JOAO PINHEIRO','PARACATU'].includes(c))return[50,.02,1,'standard'];" in a
          assert 'DELIVERY_PREDICTION_V7' in i
          assert 'id="ueCalcBtn"' in a and 'window.openCalcModal' in i
          assert a.count('["Nilopolis","1 DIA","Atendimento especial"]') == 1
          PY
      - name: Commitar e limpar
        run: |
          rm -f .github/workflows/reparar-site-uniao.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html index.html .github/workflows/reparar-site-uniao.yml
          git commit -m 'Corrigir regras e previsão de entrega da União Express'
          git push
