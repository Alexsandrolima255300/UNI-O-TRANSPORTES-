name: add-delivery-prediction
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: echo 'cHJpbnQoIkRvIG5vdCB1c2UgdGhpcyBwbGFjZWhvbGRlciIpCg==' | base64 -d > /tmp/patch.py && python3 /tmp/patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar consulta de previsão de entrega"
          git push
