name: Ajustar logo do cabecalho
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aumentar-logo-cabecalho.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aumentar logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('header .head{max-width:1400px!important;min-height:66px!important;', 'header .head{max-width:1400px!important;min-height:78px!important;')
          s=s.replace('header .logo{width:235px!important;height:58px!important;', 'header .logo{width:300px!important;height:70px!important;')
          s=s.replace('@media(max-width:1050px){.ue-nav{gap:20px}.ue-nav-item{font-size:11px}header .logo{width:205px!important}}', '@media(max-width:1050px){.ue-nav{gap:20px}.ue-nav-item{font-size:11px}header .logo{width:255px!important;height:64px!important}}')
          s=s.replace('@media(max-width:800px){header{padding:0 12px!important}header .head{min-height:62px!important;gap:12px!important}', '@media(max-width:800px){header{padding:0 12px!important}header .head{min-height:68px!important;gap:12px!important}')
          s=s.replace('header .logo{width:175px!important;height:54px!important}}', 'header .logo{width:205px!important;height:60px!important}}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || git commit -m 'Aumenta logo do cabecalho'
          git push origin HEAD:main
