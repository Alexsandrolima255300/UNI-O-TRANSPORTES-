name: Corrigir cabecalho

on:
  push:
    paths:
      - '.github/workflows/corrigir-cabecalho.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir CSS e inserir navegação
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<style>\n/* Cabeçalho inspirado no layout Rodonaves')
          if start != -1:
              end=s.find('</style>', start)
              block=s[start:end+8]
              css=block[len('<style>'): -len('</style>')]
              s=s.replace(block, css, 1)
          if 'class="ue-nav"' not in s:
              nav_script='''<script>\n(function(){\n  const head=document.querySelector('header .head');\n  if(!head || head.querySelector('.ue-nav')) return;\n  const nav=document.createElement('nav');\n  nav.className='ue-nav';\n  nav.setAttribute('aria-label','Navegação principal');\n  nav.innerHTML='<span class="ue-nav-item" data-action="track">RASTREAMENTO</span><span class="ue-nav-item">PREVISÃO DE ENTREGA</span><span class="ue-nav-item">COLETA</span><span class="ue-nav-item active" data-action="quote">COTAÇÃO</span><span class="ue-nav-item">FALE CONOSCO</span><span class="ue-nav-separator"></span><span class="ue-account">UNIÃO EXPRESS <span class="ue-chevron">▾</span></span>';\n  head.appendChild(nav);\n  const track=nav.querySelector('[data-action="track"]');\n  if(track) track.addEventListener('click',()=>window.open('https://ssw.inf.br/2/rastreamento','_blank','noopener,noreferrer'));\n  const quote=nav.querySelector('[data-action="quote"]');\n  if(quote) quote.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));\n})();\n</script>'''
              s=s.replace('</body>', nav_script+'</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commitar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || git commit -m 'Corrige estrutura e navegação do cabeçalho'
          git push
