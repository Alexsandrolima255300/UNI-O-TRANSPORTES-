name: Fix logo União Express

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace header logo and use the logo blue
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python <<'PY'
          from pathlib import Path
          from collections import Counter
          from PIL import Image
          import re, colorsys

          logo = Image.open('logo-uniao-express.jpeg').convert('RGB').resize((300, 300))
          candidates = []

          for r, g, b in logo.getdata():
              mx, mn = max(r, g, b), min(r, g, b)
              if mx < 35 or mx - mn < 35:
                  continue
              h, s, v = colorsys.rgb_to_hsv(r / 255, g / 255, b / 255)
              # Keep saturated blue/cyan-blue pixels from the actual logo.
              if 0.52 <= h <= 0.70 and s >= 0.45 and 0.25 <= v <= 0.95:
                  candidates.append((r // 4 * 4, g // 4 * 4, b // 4 * 4))

          if not candidates:
              raise SystemExit('Não foi possível identificar o azul da logo.')

          color = Counter(candidates).most_common(1)[0][0]
          blue = '#%02x%02x%02x' % color
          print(f'Azul identificado na logo: {blue}')

          path = Path('app.html')
          text = path.read_text(encoding='utf-8')

          pattern = r'(<img\s+class="logo"\s+alt="União Express Uberaba"\s+src=")[^"]*(")'
          text, count = re.subn(pattern, r'\1logo-uniao-express.jpeg\2', text, count=1)
          if count == 0:
              raise SystemExit('Logo do cabeçalho não encontrada em app.html')

          text, changed = re.subn(
              r'header\{background:(?:linear-gradient\([^;]+\)|#[0-9a-fA-F]{3,8})!important;',
              f'header{{background:{blue}!important;',
              text,
              count=1,
          )
          if changed == 0:
              raise SystemExit('Cor do cabeçalho não encontrada em app.html')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit logo/color change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "style: match header color to logo [skip ci]"
          git push
