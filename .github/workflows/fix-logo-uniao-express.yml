name: Fix logo União Express

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace embedded header logo
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app.html')
          text = path.read_text(encoding='utf-8')

          pattern = r'(<img\s+class="logo"\s+alt="União Express Uberaba"\s+src=")[^"]*(")'
          new_text, count = re.subn(pattern, r'\1logo-uniao-express.jpeg\2', text, count=1)

          if count == 0:
              raise SystemExit('Logo do cabeçalho não encontrada em app.html')

          if new_text == text:
              print('Logo já está usando logo-uniao-express.jpeg')
              raise SystemExit(0)

          path.write_text(new_text, encoding='utf-8')

      - name: Commit logo change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "fix: use logo-uniao-express.jpeg in header [skip ci]"
          git push