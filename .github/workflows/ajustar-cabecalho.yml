name: Ajustar cabeçalho União Express
on:
  push:
    branches: [main]

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar cabeçalho
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('position:sticky!important;top:0!important;z-index:1000!important', 'position:relative!important;top:auto!important;z-index:1000!important')
          s = s.replace('header{background:#fff!important;', 'header{background:linear-gradient(135deg,#064ea8,#0868cc)!important;')
          s = s.replace('.ue-nav-item{color:#0758b7!important;', '.ue-nav-item{color:#fff!important;')
          s = s.replace('.ue-nav-item:hover{color:#007ECB!important;', '.ue-nav-item:hover{color:#fff!important;')
          s = s.replace('.ue-nav-item.active{color:#007ECB!important}', '.ue-nav-item.active{color:#fff!important}')
          s = s.replace('.ue-account{display:flex!important;align-items:center!important;gap:7px!important;color:#0758b7!important;', '.ue-account{display:flex!important;align-items:center!important;gap:7px!important;color:#fff!important;')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || git commit -m 'Ajustar cabeçalho sem rolagem e textos brancos'
          git push
