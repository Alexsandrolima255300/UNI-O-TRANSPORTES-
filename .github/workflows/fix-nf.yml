name: Fix NF input

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-nf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir leitura e máscara da NF
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.html')
          text = path.read_text(encoding='utf-8')

          old = "const parse=v=>{let s=String(v||'').trim().replace(/\\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\\./g,'').replace(',','.');else s=s.replace(',','.');return Number(s)||0};"
          new = """const parse=v=>{
            let s=String(v??'').trim().replace(/\\s/g,'');
            if(!s)return 0;
            s=s.replace(/R\\$/gi,'').trim();
            if(s.includes(',')&&s.includes('.'))s=s.replace(/\\./g,'').replace(',','.');
            else if(s.includes(','))s=s.replace(',','.');
            else if((s.match(/\\./g)||[]).length>1)s=s.replace(/\\./g,'');
            const n=Number(s);
            return Number.isFinite(n)&&n>0?n:0;
          };"""

          if old not in text:
              raise SystemExit('Trecho esperado da função parse não foi encontrado; nenhuma alteração aplicada.')
          text = text.replace(old, new, 1)

          marker = "document.getElementById('cep').addEventListener('input',e=>{let v=e.target.value.replace(/\\D/g,'').slice(0,8);e.target.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v});"
          addition = marker + "\nconst nfInput=document.getElementById('nf');if(nfInput){nfInput.addEventListener('input',e=>{let v=e.target.value.replace(/[^0-9,.-]/g,'');v=v.replace(/(?!^)-/g,'');e.target.value=v});nfInput.addEventListener('blur',e=>{const n=parse(e.target.value);if(n>0)e.target.value=n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})})}"
          if marker not in text:
              raise SystemExit('Ponto de inserção da máscara da NF não foi encontrado; nenhuma alteração aplicada.')
          text = text.replace(marker, addition, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commitar correção e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-nf.yml
          git add app.html .github/workflows/fix-nf.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: reconhecer valor da NF em formatos monetarios"
          git push