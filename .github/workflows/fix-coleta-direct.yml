name: Corrigir Coleta direto no app
on:
  push:
    paths:
      - 'scripts/fix-coleta-direct.py'
      - '.github/workflows/fix-coleta-direct.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix-coleta-direct.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || git commit -m 'Corrigir clique da Coleta diretamente no app'
          git push
